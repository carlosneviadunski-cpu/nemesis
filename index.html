<!DOCTYPE html>
<html lang="pt-BR" data-theme="sepia">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joey Drew Studios - Arquivo de Sobreviventes e Monstros</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="studio-header">
    <h1>Joey Drew Studios</h1>
    <p class="subtitle">Arquivo Escolar & Guia de Sobrevivência</p>
    
    <div class="palette-picker">
      <span>Escolha a Paleta:</span>
      <button onclick="changeTheme('sepia')" class="btn-theme btn-sepia">Vintage Sepia</button>
      <button onclick="changeTheme('dark')" class="btn-theme btn-dark">Tinta Obscura</button>
      <button onclick="changeTheme('yellow')" class="btn-theme btn-yellow">Desenho 1930</button>
    </div>
  </header>

  <main class="container">

    <!-- Botão de Acesso em Tela Cheia -->
    <section class="portal-section">
      <button id="fullscreen-btn" onclick="openGameLink()" class="portal-button">
        ⚡ Acessar Arena Joey Drew Studios (Tela Cheia) ⚡
      </button>
    </section>

    <!-- LINHA 1: Sobreviventes (4 Colunas) -->
    <section class="card-section">
      <h2>Linha 1 — Sobreviventes</h2>
      <div class="grid-row">

        <div class="grid-card survivor">
          <div class="category-badge">Sobrevivente</div>
          <img src="https://m.media-amazon.com/images/M/MV5BN2E1MGFmYTYtYzkxMi00M2IwLWE0NTItYzVkMzI3ZWYwMzU2XkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg" alt="Henry Stein" class="small-thumb">
          <h3>Henry Stein</h3>
          <p class="role">Desenhista Principal</p>
          <div class="phone-box">
            <span id="phone-henry" class="phone-number">...</span>
          </div>
        </div>

        <div class="grid-card survivor">
          <div class="category-badge">Sobrevivente</div>
          <img src="https://static.wikia.nocookie.net/bendytim/images/3/36/Allison_Angel_BATDR.png" alt="Allison Pendle" class="small-thumb">
          <h3>Allison Pendle</h3>
          <p class="role">Atriz de Dublagem</p>
          <div class="phone-box">
            <span id="phone-allison" class="phone-number">...</span>
          </div>
        </div>

          <div class="category-badge">Sobrevivente</div>
          <img src="
